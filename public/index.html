<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navico Sonar</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0a0e14; color: #cdd6f4; font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #11161f; border-bottom: 1px solid #1e2530; flex-wrap: wrap; }
  header b { color: #89b4fa; }
  select, label { font: inherit; color: inherit; }
  select { background: #1e2530; border: 1px solid #313847; border-radius: 6px; padding: 4px 8px; }
  #depth { font-size: 22px; font-weight: 700; color: #a6e3a1; margin-left: auto; }
  #wrap { position: relative; height: calc(100vh - 46px); }
  #c { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #axis { position: absolute; top: 0; right: 0; height: 100%; pointer-events: none; }
  #status { position: absolute; left: 8px; bottom: 8px; font-size: 11px; color: #7f849c; background: #0009; padding: 3px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <b>Navico Sonar</b>
  <label>Source: <select id="src"><option value="">(any)</option></select></label>
  <label>Palette: <select id="pal"><option>Amber</option><option>Blue</option><option>Ice</option></select></label>
  <label>Gain: <input id="gain" type="range" min="0.5" max="3" step="0.1" value="1"></label>
  <span id="depth">-- m</span>
</header>
<div id="wrap">
  <canvas id="c"></canvas>
  <canvas id="axis"></canvas>
  <div id="status">connecting…</div>
</div>
<script>
// Live echogram waterfall. Same-origin WebSocket on the SK server:
//   ws(s)://<sk-host>/plugins/signalk-navico-sonar/stream
// (wss is chosen automatically when the page is served over https). For offline
// dev against tools/replay-pcap.js, override with ?ws=PORT or ?ws=ws://host:port.
const WS_PATH = '/plugins/signalk-navico-sonar/stream'
function wsUrl () {
  const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:'
  const ov = new URLSearchParams(location.search).get('ws')
  if (ov) return /^\d+$/.test(ov) ? `${scheme}//${location.hostname}:${ov}` : ov
  return `${scheme}//${location.host}${WS_PATH}`
}
const cv = document.getElementById('c'), ctx = cv.getContext('2d')
const ax = document.getElementById('axis'), actx = ax.getContext('2d')
const depthEl = document.getElementById('depth'), statusEl = document.getElementById('status')
const srcSel = document.getElementById('src'), palSel = document.getElementById('pal'), gainEl = document.getElementById('gain')
let W = 0, H = 0
let filterAddr = ''
let lastAxisRange = -1

function resize () {
  W = cv.width = cv.clientWidth; H = cv.height = cv.clientHeight
  ax.width = 54; ax.height = ax.clientHeight
  ctx.fillStyle = '#0a0e14'; ctx.fillRect(0, 0, W, H)
  lastAxisRange = -1 // force axis redraw
}
window.addEventListener('resize', resize); resize()

// Depth scale on a SEPARATE overlay canvas so it never enters the scroll buffer.
function drawAxis (range) {
  if (!(range > 0) || Math.abs(range - lastAxisRange) < 0.05) return
  lastAxisRange = range
  const w = ax.width, h = ax.height
  actx.clearRect(0, 0, w, h)
  actx.font = '11px system-ui'; actx.textAlign = 'right'; actx.textBaseline = 'middle'
  for (let k = 0; k <= 4; k++) {
    const y = Math.min(h - 1, Math.max(1, Math.round(h * k / 4)))
    actx.strokeStyle = '#ffffff44'; actx.beginPath(); actx.moveTo(w - 34, y + 0.5); actx.lineTo(w, y + 0.5); actx.stroke()
    const label = (range * k / 4).toFixed(range < 20 ? 1 : 0) + 'm'
    const tw = actx.measureText(label).width
    actx.fillStyle = '#000a'; actx.fillRect(w - tw - 8, y - 8, tw + 8, 16)
    actx.fillStyle = '#dfe6f0'; actx.fillText(label, w - 4, y)
  }
}

// palettes: map amplitude 0..255 -> [r,g,b]
const palettes = {
  Amber: a => [a, (a * 0.7) | 0, (a * 0.15) | 0],
  Blue: a => [(a * 0.2) | 0, (a * 0.6) | 0, a],
  Ice: a => { const t = a / 255; return [(t * t * 255) | 0, (t * 200) | 0, (80 + t * 175) | 0] }
}

function drawColumn (samples) {
  const gain = parseFloat(gainEl.value)
  const pal = palettes[palSel.value] || palettes.Amber
  // scroll the whole waterfall left by 1px
  const img = ctx.getImageData(1, 0, W - 1, H)
  ctx.putImageData(img, 0, 0)
  // draw the new ping as the rightmost column
  const col = ctx.createImageData(1, H)
  const n = samples.length
  for (let y = 0; y < H; y++) {
    const bin = (y / H * n) | 0
    let a = samples[bin] * gain; if (a > 255) a = 255
    const [r, g, b] = pal(a | 0)
    const o = y * 4
    col.data[o] = r; col.data[o + 1] = g; col.data[o + 2] = b; col.data[o + 3] = 255
  }
  ctx.putImageData(col, W - 1, 0)
}

// Same bottom pick as the plugin (lib/protocol.js estimateBottomBin): deepest
// sustained return past the near-field ring, walked up to its leading edge.
function bottomBin (s, nearFieldSkip = 20) {
  const n = s.length; if (!n) return -1
  let maxAmp = 0; for (let i = 0; i < n; i++) if (s[i] > maxAmp) maxAmp = s[i]
  if (!maxAmp) return -1
  let nf = 0; while (nf < n && s[nf] >= 0.6 * maxAmp) nf++
  const start = Math.max(nearFieldSkip, nf + Math.round(0.02 * n)); if (start >= n) return -1
  let regionMax = 0; for (let i = start; i < n; i++) if (s[i] > regionMax) regionMax = s[i]
  if (!regionMax) return -1
  const thr = Math.max(8, 0.5 * regionMax)
  let bi = -1; for (let i = n - 1; i >= start; i--) { if (s[i] >= thr) { bi = i; break } }
  if (bi < 0) return -1
  let top = bi; while (top > start && s[top - 1] >= 0.5 * thr) top--
  return top
}

function connect () {
  const ws = new WebSocket(wsUrl())
  ws.binaryType = 'arraybuffer'
  ws.onopen = () => { statusEl.textContent = 'connected' }
  ws.onclose = () => { statusEl.textContent = 'disconnected — retrying'; setTimeout(connect, 1500) }
  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      const m = JSON.parse(ev.data)
      if (m.type === 'sources') updateSources(m.sources)
      return
    }
    // binary ping frame (20B hdr):
    // [0x01][channel][u32 seq][f32 rangeUpper][f32 rangeLower][u16 n][4B src IPv4][n samples]
    const dv = new DataView(ev.data)
    const channel = dv.getUint8(1)
    if (channel !== 0x02) return // conventional only for the main view
    const rangeUpper = dv.getFloat32(6, true)
    const rangeLower = dv.getFloat32(10, true)
    const n = dv.getUint16(14, true)
    const srcIP = `${dv.getUint8(16)}.${dv.getUint8(17)}.${dv.getUint8(18)}.${dv.getUint8(19)}`
    if (filterAddr && srcIP !== filterAddr) return // not the selected source
    const samples = new Uint8Array(ev.data, 20, n)
    const range = rangeUpper > 0 ? rangeUpper : rangeLower // display range = canvas height
    drawColumn(samples)
    drawAxis(range)
    // depth = leading edge of the deepest sustained return (skip near-field)
    const bi = bottomBin(samples)
    if (bi > 0 && range > 0) depthEl.textContent = ((bi / n) * range).toFixed(1) + ' m'
  }
}

function updateSources (list) {
  const cur = srcSel.value
  srcSel.innerHTML = '<option value="">(any)</option>'
  for (const s of list) {
    if (s.active === false) continue // hide bare announcers (no transducer, no data)
    const o = document.createElement('option')
    o.value = s.address
    const tag = s.transducer ? ' [' + s.transducer + ']' : (s.hasData ? ' [live]' : '')
    o.textContent = `${s.name} — ${s.model}${tag}`
    srcSel.appendChild(o)
  }
  // if the selected source vanished from the active list, fall back to (any)
  if (cur && !list.some(s => s.address === cur && s.active !== false)) { srcSel.value = ''; filterAddr = '' }
  else srcSel.value = cur
}
srcSel.onchange = () => {
  filterAddr = srcSel.value
  ctx.fillStyle = '#0a0e14'; ctx.fillRect(0, 0, W, H) // clear old source's trace
  actx.clearRect(0, 0, ax.width, ax.height); lastAxisRange = -1 // reset scale
  depthEl.textContent = '-- m'
}
connect()
</script>
</body>
</html>
